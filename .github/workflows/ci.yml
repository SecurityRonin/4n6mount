name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · coverage · path-dep gate.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@85c7263e5e1a25a090f602419ac27f87aeb1d1e3
    with:
      # `fuser` links libfuse at build time. The workflow this replaces carried
      # this apt step by hand in four separate jobs; the shared workflow now
      # takes it as an input so adoption cannot silently drop it. A native
      # dependency fails in the LINKER rather than in cargo, so losing it shows
      # up as "failed to run custom build command for fuser" — which is exactly
      # how forensic-mount 0.6.1 failed to publish.
      system-packages: libfuse3-dev pkg-config

      # libfuse3-dev is Linux-only and `system-packages` is deliberately gated to
      # Linux, so the macOS and Windows legs could not build fuser. This is NOT a
      # narrowing: the workflow being replaced ran its test job on ubuntu-latest
      # only, so the platform set is unchanged.
      os-matrix: false

      # MIGRATION DEBT — and the first time this repo has measured coverage at
      # all. The workflow being replaced had no coverage job, so there is no
      # earlier number to regress from. Measured at the fleet scope
      # (--workspace --all-features): 60.54% of lines.
      #
      # The floor is 60, just under the measured value, so it holds the line
      # rather than granting slack — a real drop still fails. It is not the
      # fleet's per-line gate: a floor cannot honour a `// cov:unreachable`
      # exemption and never names which lines are uncovered, so the shared
      # workflow renders it in the checks UI as debt and warns on every run.
      #
      # REMOVE WHEN: the uncovered surface is tested and this repo can inherit
      # `coverage-gate: strict`. types.rs at 24% of lines is the largest gap.
      coverage-gate: floor
      coverage-floor: 60
