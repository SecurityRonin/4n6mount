# The rpath FUSE-T builds need.
#
# cargo forwards `-L` and `-l` from pkg-config but DROPS `-Wl,-rpath`, so a
# FUSE-T build links correctly and then dies at startup with
# `dyld: Library not loaded ... no LC_RPATH's found`. Setting it here is
# harmless for macFUSE builds (the path simply goes unused).
#
# PKG_CONFIG_PATH is deliberately NOT set here. Cargo's `[env]` can only set or
# replace, never append, and PKG_CONFIG_PATH is a colon-separated list that must
# compose: this machine already exports the e2fsprogs path, which ext4 support
# needs. `force = true` would silently break ext4; `force = false` is ignored
# whenever the variable is already set. See packaging/fuse-t/README.md for the
# build command that composes correctly.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/local/lib"]
